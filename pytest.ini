[pytest]
# Worker unit tests need no services; integration tests self-skip unless a
# LibreNMS instance is configured (see tests/integration/test_api_contract.py).
testpaths = tests
pythonpath = worker
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:br.*
markers =
    integration: needs a live LibreNMS instance
